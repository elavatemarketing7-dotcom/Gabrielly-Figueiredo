
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dra. Gabrielly Figueiredo | Harmonização Facial de Alta Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              premium: {
                champagne: '#F7F3F0',
                bronze: '#B08D74',
                espresso: '#2A2420',
                gold: '#C5A059',
                pearl: '#FFFFFF',
                sand: '#EAE0D5'
              }
            },
            fontFamily: {
              serif: ['Playfair Display', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'fade-up': 'fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'marquee': 'marquee 40s linear infinite',
              'float': 'float 6s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
            },
            keyframes: {
              fadeUp: {
                '0%': { opacity: '0', transform: 'translateY(40px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #F7F3F0;
        color: #2A2420;
        -webkit-font-smoothing: antialiased;
      }
      .editorial-shadow {
        box-shadow: 0 40px 100px -20px rgba(42, 36, 32, 0.08);
      }
      .glass-light {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .text-balance { text-wrap: balance; }
      
      .paper-card {
        background: #FFFFFF;
        border: 1px solid rgba(176, 141, 116, 0.1);
        transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .paper-card:hover {
        border-color: rgba(176, 141, 116, 0.3);
        transform: translateY(-8px);
      }
      
      .bronze-gradient {
        background: linear-gradient(135deg, #B08D74 0%, #2A2420 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      
      .staggered-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 2rem;
        align-items: start;
      }
    </style>
