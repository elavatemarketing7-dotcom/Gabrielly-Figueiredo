
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dra. Gabrielly Figueiredo | Harmonização Facial de Alta Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              premium: {
                champagne: '#FDFBF9',
                bronze: '#B08D74',
                espresso: '#1C1917',
                gold: '#D4AF37',
                pearl: '#FFFFFF',
                sand: '#EAE0D5'
              }
            },
            fontFamily: {
              serif: ['Playfair Display', 'serif'],
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'fade-up': 'fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'marquee': 'marquee 60s linear infinite',
              'float': 'float 8s ease-in-out infinite',
              'pulse-soft': 'pulseSoft 3s ease-in-out infinite',
            },
            keyframes: {
              fadeUp: {
                '0%': { opacity: '0', transform: 'translateY(60px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              marquee: {
                '0%': { transform: 'translateX(0)' },
                '100%': { transform: 'translateX(-50%)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-30px)' },
              },
              pulseSoft: {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.6' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #FDFBF9;
        color: #1C1917;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      .editorial-shadow {
        box-shadow: 0 50px 100px -20px rgba(28, 25, 23, 0.1);
      }
      .glass-premium {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(176, 141, 116, 0.2);
      }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .text-balance { text-wrap: balance; }
      
      .paper-card {
        background: #FFFFFF;
        border: 1px solid rgba(176, 141, 116, 0.08);
        transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .paper-card:hover {
        border-color: rgba(176, 141, 116, 0.2);
        transform: translateY(-12px);
        box-shadow: 0 40px 80px -15px rgba(28, 25, 23, 0.05);
      }
      
      .bronze-gradient {
        background: linear-gradient(135deg, #B08D74 0%, #1C1917 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .gold-shimmer {
        background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
        background-size: 200% 100%;
        animation: shimmer 3s infinite;
      }

      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      
      ::selection {
        background-color: #1C1917;
        color: #FDFBF9;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
